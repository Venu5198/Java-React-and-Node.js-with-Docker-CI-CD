name: Continuous Integration & Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================================
  # Gate 1: Secret Detection Gate
  # ============================================================================
  secret-detection-gate:
    name: "Gate 1: Secret Detection (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Gate 2: Static Code Analysis Gate (SAST)
  # ============================================================================
  sast-gate:
    name: "Gate 2: SAST Code Analysis (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ""

  # ============================================================================
  # Gate 3: Dockerfile Quality & Linting Gate (Hadolint)
  # ============================================================================
  dockerfile-lint-gate:
    name: "Gate 3: Dockerfile Quality (Hadolint)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Java Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: java-app/Dockerfile
          failure-threshold: error

      - name: Lint React Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: react-app/Dockerfile
          failure-threshold: error

      - name: Lint Node.js Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: node-app/Dockerfile
          failure-threshold: error

  # ============================================================================
  # Gate 4: Java Quality, Unit Tests & Coverage Gate (JaCoCo)
  # ============================================================================
  java-quality-gate:
    name: "Gate 4: Java Build, Tests & Coverage (JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Unit Tests & Verify JaCoCo Coverage Gate (>=60%)
        working-directory: ./java-app
        run: mvn clean test -B

      - name: Build Application Package
        working-directory: ./java-app
        run: mvn package -DskipTests -B

  # ============================================================================
  # Gate 5: React Linting, Dependency Security, Tests & Build Gate
  # ============================================================================
  react-quality-gate:
    name: "Gate 5: React Lint, Audit, Tests & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies with reproducible lockfile
        working-directory: ./react-app
        run: npm ci

      - name: Linting Gate (ESLint)
        working-directory: ./react-app
        run: npm run lint

      - name: Dependency Security Gate (npm audit)
        working-directory: ./react-app
        run: npm audit --audit-level=high

      - name: Build Gate (Vite Production Bundle)
        working-directory: ./react-app
        run: npm run build

      - name: Unit Test Gate
        working-directory: ./react-app
        run: npm test

  # ============================================================================
  # Gate 6: Node.js Linting, Dependency Security, Coverage & API Tests Gate
  # ============================================================================
  node-quality-gate:
    name: "Gate 6: Node.js Lint, Audit, Coverage & API Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node-app/package-lock.json

      - name: Install dependencies with reproducible lockfile
        working-directory: ./node-app
        run: npm ci

      - name: Linting Gate (ESLint)
        working-directory: ./node-app
        run: npm run lint

      - name: Dependency Security Gate (npm audit)
        working-directory: ./node-app
        run: npm audit --audit-level=high

      - name: Test Coverage Gate & API Tests
        working-directory: ./node-app
        run: npm run test:coverage

  # ============================================================================
  # Gate 7: Container Image Build & Vulnerability Scanning Gate (Trivy)
  # ============================================================================
  container-image-gate:
    name: "Gate 7: Container Image Build & CVE Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [secret-detection-gate, sast-gate, dockerfile-lint-gate, java-quality-gate, react-quality-gate, node-quality-gate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Java image
        run: docker build -t java-app:ci ./java-app

      - name: Build React image
        run: docker build -t react-app:ci ./react-app

      - name: Build Node.js image
        run: docker build -t node-app:ci ./node-app

      - name: Scan Node container for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node-app:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Scan React container for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'react-app:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Scan Java container for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'java-app:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Gate 8: Live API Testing & Smoke Test Gate (Docker Compose)
  # ============================================================================
  api-smoke-test-gate:
    name: "Gate 8: Live API Testing & Smoke Verification"
    runs-on: ubuntu-latest
    needs: [container-image-gate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start services via Docker Compose
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for services to report healthy..."
          sleep 20
          docker compose ps

      - name: Test Java Health Endpoint (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          [ "$STATUS" -eq 200 ] || { echo "Java Health check failed: $STATUS"; exit 1; }

      - name: Test Java Employees API (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/employees)
          [ "$STATUS" -eq 200 ] || { echo "Java Employees check failed: $STATUS"; exit 1; }

      - name: Test React Frontend Health (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          [ "$STATUS" -eq 200 ] || { echo "React Health check failed: $STATUS"; exit 1; }

      - name: Test React SPA Root Asset Delivery (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          [ "$STATUS" -eq 200 ] || { echo "React SPA root check failed: $STATUS"; exit 1; }

      - name: Test Node.js Health Endpoint (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)
          [ "$STATUS" -eq 200 ] || { echo "Node Health check failed: $STATUS"; exit 1; }

      - name: Test Node.js Products API (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/products)
          [ "$STATUS" -eq 200 ] || { echo "Node Products check failed: $STATUS"; exit 1; }

      - name: Teardown environment
        if: always()
        run: docker compose down

  # ============================================================================
  # Gate 9: Quality Gate Thresholds & Final Approval
  # ============================================================================
  quality-gate-threshold-approval:
    name: "Gate 9: Quality Gate Threshold Approval"
    runs-on: ubuntu-latest
    needs: [api-smoke-test-gate]
    steps:
      - name: Verify all quality gates satisfied
        run: |
          echo "=========================================================="
          echo " QUALITY GATE DECISION: PASSED"
          echo " 1. Secret Detection Gate:       0 Leaks"
          echo " 2. SAST Code Analysis Gate:     0 High Severity Issues"
          echo " 3. Dockerfile Quality Gate:     0 Hadolint Errors"
          echo " 4. Build Gate:                  All 3 Apps Compiled"
          echo " 5. Linting Gate:                0 ESLint Errors"
          echo " 6. Dependency Security Gate:    0 High/Critical CVEs"
          echo " 7. Unit Test Gate:              100% Pass Rate"
          echo " 8. Test Coverage Gate:          >= 60% Java (JaCoCo) & >= 80% Node"
          echo " 9. Container Quality Gate:      Trivy Scans Passed"
          echo " 10. Live API Testing Gate:      All Endpoints Returned HTTP 200"
          echo "=========================================================="
